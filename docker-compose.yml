version: '3.8'

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB=rti_inventory
    depends_on:
      mongo:
        condition: service_healthy
  
  seeder:
    image: golang:1.24-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB=rti_inventory
    command: go run ./cmd/seed --reset
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data:
